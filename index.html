<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Math Battle Pro</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="app">
      <header class="top">
        <h1>⚔️ Math Battle Pro</h1>
        <p class="subtitle">Answer fast. Defeat the AI. Reach the top score.</p>
      </header>

      <section class="board">
        <article class="fighter">
          <h2>You</h2>
          <div class="hp-wrap"><div id="player-hp" class="hp player"></div></div>
          <p><span id="player-hp-text">100</span> HP</p>
        </article>

        <article class="fighter">
          <h2>AI Rival</h2>
          <div class="hp-wrap"><div id="ai-hp" class="hp ai"></div></div>
          <p><span id="ai-hp-text">100</span> HP</p>
        </article>
      </section>

      <section class="hud">
        <p>Round: <strong id="round">1</strong></p>
        <p>Score: <strong id="score">0</strong></p>
        <p>Streak: <strong id="streak">0</strong></p>
        <p>High Score: <strong id="high-score">0</strong></p>
        <p>Time: <strong id="time-left">15</strong>s</p>
      </section>

      <section class="question-card">
        <p id="difficulty-tag" class="difficulty">Easy</p>
        <p id="question" class="question">Press Start to begin!</p>
        <form id="answer-form">
          <input
            id="answer-input"
            type="number"
            step="any"
            inputmode="numeric"
            autocomplete="off"
            placeholder="Your answer"
            disabled
          />
          <button id="submit-btn" type="submit" disabled>Attack</button>
        </form>
        <p id="feedback" class="feedback">Get ready for battle.</p>
      </section>

      <section class="controls">
        <button id="start-btn" class="primary">Start Battle</button>
        <button id="next-btn" class="secondary" disabled>Next Round</button>
        <button id="restart-btn" class="secondary" disabled>Restart</button>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
